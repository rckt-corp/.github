# Org-required workflow: static-check that every job targets an rckt runner.
# Applied across rckt-corp via the "require-allowed-runners" organization ruleset.
name: Enforce allowed runners

on:
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  check-runs-on:
    name: Check runs-on allowlist
    runs-on: rckt-arc-lite
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve policy ref
        id: policy
        shell: bash
        run: |
          if [ "${GITHUB_REPOSITORY}" = "rckt-corp/.github" ]; then
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              echo "ref=${{ github.event.pull_request.head.sha }}" >> "${GITHUB_OUTPUT}"
            else
              echo "ref=${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"
            fi
          else
            # Ruleset pins this workflow file; keep the action on the same branch.
            echo "ref=main" >> "${GITHUB_OUTPUT}"
          fi

      - name: Checkout runner policy
        uses: actions/checkout@v4
        with:
          repository: rckt-corp/.github
          ref: ${{ steps.policy.outputs.ref }}
          path: .rckt-policy
          sparse-checkout: |
            .github/actions/enforce-runners
          sparse-checkout-cone-mode: true

      - name: Enforce allowed runners
        uses: ./.rckt-policy/.github/actions/enforce-runners
