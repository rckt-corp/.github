name: Enforce allowed runners
description: Fail if workflow jobs use runners outside the rckt self-hosted allowlist.

runs:
  using: composite
  steps:
    - name: Install PyYAML
      shell: bash
      run: python3 -m pip install --user --quiet pyyaml

    - name: Check workflow runs-on allowlist
      shell: bash
      run: |
        export PATH="${HOME}/.local/bin:${PATH}"
        python3 "${GITHUB_ACTION_PATH}/check.py"
