---
# Org-required workflow selected from this repository's protected main.
# New repositories stay blocked until their target branch has a native queue.
# Public source supports both public and private organization repositories.
# Organization rulesets must select this definition from protected main.
# Inline read-only code never checks out or executes candidate code.
name: Native queue required

on:
  pull_request:
  merge_group:

permissions:
  contents: read
  pull-requests: read

jobs:
  queue:
    # GitHub requires a job conditional for cross-repository PR injection.
    if: true
    name: Native queue required
    # Public repositories cannot access the organization's private runner groups.
    # The repository visibility is supplied by GitHub for the consuming event.
    runs-on: ${{ github.event.repository.private && 'rckt-arc-lite' || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - name: Require native queue configuration
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd  # v8
        with:
          script: |
            const {owner, repo} = context.repo;
            const fail = message => { throw new Error(message); };
            let branch;
            if (context.eventName === 'pull_request') {
              const base = context.payload.pull_request?.base;
              if (base?.repo?.full_name !== `${owner}/${repo}`) fail('Invalid PR base repository.');
              branch = base.ref;
            } else if (context.eventName === 'merge_group') {
              const ref = context.payload.merge_group?.base_ref;
              if (typeof ref !== 'string' || !ref.startsWith('refs/heads/')) fail('Invalid queue base ref.');
              branch = ref.slice('refs/heads/'.length);
            } else {
              fail('Unsupported queue policy event.');
            }
            if (owner !== 'rckt-corp' || typeof branch !== 'string' || !branch) {
              fail('Missing organization or target branch identity.');
            }
            const {data: repository} = await github.rest.repos.get({owner, repo});
            if (repository?.full_name !== `${owner}/${repo}` ||
                repository.default_branch !== branch) {
              fail('Cannot verify the repository default branch.');
            }
            // Effective active rules include repository and organization policies.
            // This endpoint needs only Metadata: read, unlike mergeQueue.configuration.
            let queueRules = 0;
            for await (const {data: rules} of github.paginate.iterator(
              'GET /repos/{owner}/{repo}/rules/branches/{branch}',
              {owner, repo, branch, per_page: 100}
            )) {
              if (!Array.isArray(rules)) fail('Invalid effective branch rules response.');
              for (const rule of rules) {
                if (!rule || typeof rule.type !== 'string') fail('Invalid effective branch rule.');
                if (rule.type !== 'merge_queue') continue;
                queueRules += 1;
                const configuration = rule.parameters;
                if (configuration?.grouping_strategy !== 'ALLGREEN' || configuration.merge_method !== 'SQUASH') {
                  fail('Configure an ALLGREEN/SQUASH native merge queue on the default branch before merging.');
                }
              }
            }
            if (queueRules === 0) {
              fail('Configure an ALLGREEN/SQUASH native merge queue on the default branch before merging.');
            }
            core.info(`Native queue configured for ${owner}/${repo}:${branch}.`);
